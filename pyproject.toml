[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "thermo_cycles.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "thermo-cycles"
dynamic = ["version"]
description = "Thermodynamic cycle calculator: pick a cycle, give what you know, get every state"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesper Meijerink", email = "jnmeijerink@tudelft.nl" }]
keywords = ["thermodynamics", "thermodynamic cycles", "otto", "diesel", "brayton", "atkinson", "engineering", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/J1mmortal/thermo-cycles"
Source = "https://github.com/J1mmortal/thermo-cycles"
Issues = "https://github.com/J1mmortal/thermo-cycles/issues"
Documentation = "https://github.com/J1mmortal/thermo-cycles#readme"
Changelog = "https://github.com/J1mmortal/thermo-cycles/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
