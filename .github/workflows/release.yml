name: release

# Tag push (v*) -> build, verify tag == package version, test the built wheel, publish to PyPI.
# Manual run (Actions tab -> release -> Run workflow) -> same build, publish to TestPyPI only.
# Publishing uses PyPI Trusted Publishing (OIDC). There are no tokens or secrets in this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Install the built wheel in a clean venv and test it
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/python" -m pip install "$(ls "$PWD"/dist/*.whl)[plot,dev]"
          mkdir "$RUNNER_TEMP/check"
          cp -r tests examples docs README.md LICENSE "$RUNNER_TEMP/check/"
          cd "$RUNNER_TEMP/check"
          MPLBACKEND=Agg "$RUNNER_TEMP/wheelenv/bin/python" -m pytest -q -p no:cacheprovider
          for f in examples/*.py; do MPLBACKEND=Agg "$RUNNER_TEMP/wheelenv/bin/python" -W error "$f" > /dev/null; done
      - name: Tag must equal the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$("$RUNNER_TEMP/wheelenv/bin/python" -c 'import thermo_cycles; print(thermo_cycles.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi
          ls dist | grep -F "$PKG_VERSION" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thermo-cycles
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI (manual)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/thermo-cycles
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
